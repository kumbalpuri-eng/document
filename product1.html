<style>
:root{--bg:#f3f4f7;--card:#fff;--tx:#1a1d26;--txs:#6b7280;--ac:#d97706;--acl:#b45309;--acd:#fef3c7;--bd:#e2e5eb;--ok:#16a34a;--err:#dc2626;--inf:#0891b2}
*{margin:0;padding:0;box-sizing:border-box;scrollbar-width:thin;scrollbar-color:var(--bd) transparent}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:var(--bd);border-radius:3px}
body{background:var(--bg);color:var(--tx);font-family:'Space Grotesk',sans-serif;overflow:hidden;height:100vh;width:100vw}
.sidebar{position:fixed;top:0;left:0;width:230px;height:100vh;background:var(--card);border-right:1px solid var(--bd);overflow-y:auto;z-index:40;box-shadow:2px 0 12px rgba(0,0,0,.05)}
.sidebar .logo{padding:12px 14px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px}
.sidebar .logo-icon{width:32px;height:32px;border-radius:8px;background:var(--ac);display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px}
.sidebar .logo-text{font-size:12px;font-weight:700;color:var(--tx);line-height:1.2}
.sidebar .logo-sub{font-size:10px;color:var(--txs)}
.nav-grp{padding:6px 10px 2px;font-size:9px;font-weight:700;color:var(--txs);text-transform:uppercase;letter-spacing:1.2px}
.nav-link{display:block;padding:4px 10px 4px 14px;font-size:11px;color:var(--txs);border-left:3px solid transparent;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:all .15s;text-decoration:none}
.nav-link:hover{color:var(--tx);background:var(--bg);border-left-color:var(--txs)}
.nav-link.active{color:var(--acl);background:var(--acd);border-left-color:var(--ac);font-weight:600}
#slidesWrap{position:fixed;top:0;left:230px;right:0;bottom:44px;overflow:hidden}
.slide{position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .25s}
.slide.active{opacity:1;visibility:visible;pointer-events:auto;z-index:1}
.slide-inner{width:100%;height:100%;overflow:auto;padding:16px 20px}
.slide-title{font-size:15px;font-weight:700;color:var(--acl);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.slide-title .n{font-size:10px;font-weight:600;background:var(--ac);color:#fff;width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center}
.slide-sub{font-size:11px;font-weight:600;color:var(--txs);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.cw{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:12px;margin:6px 0;overflow-x:auto}
.mermaid{display:flex;justify-content:center}
.mermaid svg{max-width:100%;height:auto}
table{border-collapse:collapse;width:100%;font-size:10.5px}
th{text-align:left;padding:6px 8px;font-weight:600;color:var(--acl);border-bottom:2px solid var(--ac);font-size:9.5px;text-transform:uppercase;letter-spacing:.4px;background:var(--acd);white-space:nowrap}
td{padding:5px 8px;border-bottom:1px solid var(--bd);color:var(--tx)}
tr:hover td{background:rgba(217,119,6,.04)}
.badge{display:inline-block;padding:1px 8px;border-radius:12px;font-size:9.5px;font-weight:600}
.b-ok{background:rgba(22,163,74,.1);color:var(--ok)}
.b-err{background:rgba(220,38,38,.1);color:var(--err)}
.b-warn{background:rgba(217,119,6,.1);color:var(--acl)}
.b-inf{background:rgba(8,145,178,.1);color:var(--inf)}
.sc{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px 14px;text-align:center}
.sc .v{font-size:22px;font-weight:800;color:var(--acl)}
.sc .l{font-size:9px;color:var(--txs);text-transform:uppercase;letter-spacing:.6px;margin-top:2px}
.ev-row{display:grid;grid-template-columns:150px 1fr;border-bottom:1px solid var(--bd)}
.ev-row .k{padding:7px 12px;font-weight:600;color:var(--acl);font-size:10px;text-transform:uppercase;letter-spacing:.4px;background:var(--acd)}
.ev-row .val{padding:7px 12px;font-size:11px;color:var(--tx)}
.info-box{border-left:3px solid var(--ac);background:var(--acd);border-radius:0 6px 6px 0;padding:10px 14px;font-size:11px;color:var(--tx);margin:8px 0}
.info-box.err{border-left-color:var(--err);background:rgba(220,38,38,.04)}
.info-box.ok{border-left-color:var(--ok);background:rgba(22,163,74,.04)}
.card-box{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:10px 12px}
.card-box .ct{font-size:11px;font-weight:700;color:var(--tx);margin-bottom:3px}
.card-box .cd{font-size:10px;color:var(--txs);margin-bottom:5px}
#bottomNav{position:fixed;bottom:0;left:230px;right:0;height:44px;background:var(--card);border-top:1px solid var(--bd);display:flex;align-items:center;justify-content:center;gap:16px;z-index:30}
#bottomNav button{background:none;border:1px solid var(--bd);border-radius:6px;padding:4px 12px;font-size:11px;font-family:inherit;color:var(--txs);cursor:pointer;transition:all .15s}
#bottomNav button:hover{border-color:var(--ac);color:var(--acl)}
#bottomNav .counter{font-size:11px;color:var(--txs);font-variant-numeric:tabular-nums;min-width:60px;text-align:center}
#fab{position:fixed;bottom:52px;right:16px;display:flex;flex-direction:column;gap:6px;z-index:50}
#fab button{border:none;border-radius:10px;padding:8px 16px;font-family:inherit;font-size:11px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all .2s;box-shadow:0 3px 12px rgba(0,0,0,.12)}
#fab button:hover{transform:translateY(-1px);box-shadow:0 5px 18px rgba(0,0,0,.18)}
#fab button:disabled{opacity:.5;cursor:wait;transform:none}
#fab .fb-pdf{background:linear-gradient(135deg,#d97706,#b45309);color:#fff}
#fab .fb-xls{background:linear-gradient(135deg,#16a34a,#15803d);color:#fff}
#fab .fb-doc{background:linear-gradient(135deg,#0891b2,#0e7490);color:#fff}
#loader{position:fixed;inset:0;background:var(--card);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
#loader .spinner{width:36px;height:36px;border:3px solid var(--bd);border-top-color:var(--ac);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:1024px){
  .sidebar{transform:translateX(-100%);z-index:50}
  .sidebar.open{transform:translateX(0)}
  #slidesWrap{left:0}
  #bottomNav{left:0}
  .grid-2,.grid-3,.grid-4{grid-template-columns:1fr}
}
</style>
</head>

  const div = document.createElement('div');
  div.className = 'slide' + (i === 0 ? ' active' : '');
  div.dataset.slide = i;
  div.innerHTML = renderSlide(s, i);
  container.appendChild(div);

  /* Nav link */
  if (i === 0 || S[i].g !== S[i-1].g) {
    const grp = document.createElement('div');
    grp.className = 'nav-grp';
    grp.textContent = s.g;

  a.href = '#';

  nav.appendChild(a);
});

/* ===== NAVIGATION ===== */
function goTo(i) {
  if (i < 0 || i >= S.length) return;
  document.querySelectorAll('.slide').forEach((s, idx) => s.classList.toggle('active', idx === i));
  document.querySelectorAll('.nav-link').forEach((a, idx) => a.classList.toggle('active', idx === i));
  cur = i;
  document.getElementById('counter').textContent = `${i + 1} / ${S.length}`;
  /* Scroll sidebar link into view */
  const activeLink = nav.querySelector('.nav-link.active');
  if (activeLink) activeLink.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}
function go(d) { goTo(cur + d); }
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') go(1);
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') go(-1);
  if (e.key === 'Home') goTo(0);
  if (e.key === 'End') goTo(S.length - 1);
});

/* ===== PDF GENERATION ===== */
async function genPDF(btn) {
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Wait...';

  /* Hide UI */
  document.getElementById('sidebar').style.display = 'none';
  document.getElementById('bottomNav').style.display = 'none';
  document.getElementById('fab').style.display = 'none';
  document.getElementById('menuBtn').style.display = 'none';

  /* Stack slides vertically */
  const wrap = document.getElementById('slidesWrap');
  const slides = wrap.querySelectorAll('.slide');
  wrap.style.position = 'relative';
  wrap.style.height = 'auto';
  wrap.style.overflow = 'visible';
  wrap.style.bottom = '0';
  slides.forEach(s => {
    s.style.position = 'relative';
    s.style.visibility = 'visible';
    s.style.opacity = '1';
    s.style.height = 'auto';
    s.style.minHeight = '100vh';
    s.style.pageBreakBefore = 'always';
    s.style.pageBreakInside = 'avoid';
  });
  slides[0].style.pageBreakBefore = 'auto';

  try {
    await html2pdf().set({
      margin: [4, 4, 4, 4],
      filename: 'VMP-X1_Product_Dossier.pdf',
      image: { type: 'jpeg', quality: 0.92 },
      html2canvas: { scale: 1.5, useCORS: true, logging: false, windowWidth: wrap.scrollWidth },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
      pagebreak: { mode: ['css', 'legacy'], before: '.slide' }
    }).from(wrap).save();
  } catch (e) {
    console.error(e);
    alert('PDF generation failed. Try Ctrl+P as fallback.');
  }

  /* Restore */
  slides.forEach((s, i) => {
    s.style.position = 'absolute';
    s.style.height = '100%';
    s.style.minHeight = '';
    s.style.pageBreakBefore = '';
    s.style.pageBreakInside = '';
    if (i !== cur) { s.style.visibility = 'hidden'; s.style.opacity = '0'; }
  });
  wrap.style.position = 'fixed';
  wrap.style.height = 'calc(100vh - 44px)';
  wrap.style.overflow = 'hidden';
  wrap.style.bottom = '44px';
  document.getElementById('sidebar').style.display = '';
  document.getElementById('bottomNav').style.display = '';
  document.getElementById('fab').style.display = '';
  if (window.innerWidth <= 1024) document.getElementById('menuBtn').style.display = 'block';

  btn.disabled = false;
  btn.innerHTML = '<i class="fas fa-file-pdf"></i> PDF';
}

  XLSX.writeFile(wb, 'Product_Dossier_Template.xlsx');
}

/* ===== WORD TEMPLATE ===== */
function genDOC() {
  const sections = ['Product Overview','Product Function','Product Architecture','Engineering','Manufacturing Process','Machines & Equipment','Tooling','Quality Control','Defects Analysis','Testing','Material Flow','Supply Chain','Cost Structure','Production KPIs','Maintenance','Safety','Lean Manufacturing','Digital Systems','Finance','Customer Perspective','People & Organization','Risks','Continuous Improvement','Daily Management','Plant Head Review','Executive Summary'];
  let html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><title>Product Dossier Template</title><style>
body{font-family:Calibri,sans-serif;font-size:11pt;margin:20mm;color:#1a1d26}
h1{font-size:20pt;color:#b45309;border-bottom:2px solid #d97706;padding-bottom:6pt;margin-top:24pt}
h2{font-size:14pt;color:#b45309;margin-top:18pt;border-bottom:1px solid #e2e5eb;padding-bottom:4pt}
table{border-collapse:collapse;width:100%;margin:8pt 0}
th{background:#fef3c7;color:#b45309;border:1px solid #d97706;padding:4pt 8pt;font-size:9pt;text-align:left;font-weight:bold}
td{border:1px solid #ddd;padding:4pt 8pt;font-size:10pt}
.ph{color:#999;font-style:italic}
.note{background:#fef3c7;border-left:3px solid #d97706;padding:8pt 12pt;margin:8pt 0;font-size:10pt}
</style></head><body>
<h1>[PRODUCT NAME] — Product Dossier</h1>
<p class="ph">[Company Name] | [Date] | IATF 16949 | ISO 9001:2015 | Confidential</p>
<p class="ph">[Brief product description — 2-3 sentences]</p>`;
  sections.forEach(sec => {
    html += `<h2>${sec}</h2>`;
    if (['Product Function','Defects Analysis','Improvement'].includes(sec)) {
      html += `<p class="ph">[Insert flowchart / 5-Why diagram — use SmartArt or insert image]</p>`;
    }
    html += `<table><tr><th class="ph">[Column 1]</th><th class="ph">[Column 2]</th><th class="ph">[Column 3]</th><th class="ph">[Column 4]</th><th class="ph">[Column 5]</th></tr>`;
    for (let r = 0; r < 3; r++) {
      html += '<tr>';
      for (let c = 0; c < 5; c++) html += `<td class="ph">[Enter data]</td>`;
      html += '</tr>';
    }
    html += '</table>';
    if (sec === 'Executive Summary') {
      html += `<div class="note"><strong>Confidentiality:</strong> This document contains proprietary information. Distribution restricted to authorized personnel only.</div>`;
    }
  });
  html += '</body></html>';
  const blob = new Blob([html], { type: 'application/msword' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'Product_Dossier_Template.doc';
  a.click();
  URL.revokeObjectURL(a.href);
}
</script>
