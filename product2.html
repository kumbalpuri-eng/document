#bottomNav .counter{font-size:11px;color:var(--txs);font-variant-numeric:tabular-nums;min-width:60px;text-align:center}
#fab{position:fixed;bottom:52px;right:16px;display:flex;flex-direction:column;gap:6px;z-index:50}
#fab button{border:none;border-radius:10px;padding:8px 16px;font-family:inherit;font-size:11px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all .2s;box-shadow:0 3px 12px rgba(0,0,0,.12)}

#fab .fb-pdf{background:linear-gradient(135deg,#d97706,#b45309);color:#fff}
#fab .fb-xls{background:linear-gradient(135deg,#16a34a,#15803d);color:#fff}
#fab .fb-doc{background:linear-gradient(135deg,#0891b2,#0e7490);color:#fff}

#loader .spinner{width:36px;height:36px;border:3px solid var(--bd);border-top-color:var(--ac);border-radius:50%;animation:spin .8s linear infinite}

.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
